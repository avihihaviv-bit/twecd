name: Build TWECD-Setup.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: TWECD-Setup, path: release/TWECD-*.* }
      - name: Publish release (download link always points to the latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: TWECD GAMING BOOSTER v${{ steps.ver.outputs.v }}
          make_latest: true
          files: |
            release/TWECD-Setup.exe
            release/TWECD-Setup.exe.blockmap
            release/latest.yml
            release/TWECD-Portable.zip
          body: |
            Download **TWECD-Setup.exe** and double-click to install. A desktop shortcut is created automatically.
            Installed copies (v1.3.0+) offer this update inside the app and only install it after you click.
